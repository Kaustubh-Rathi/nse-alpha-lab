[project]
name = "nse-rotation-research"
version = "0.1.0"
description = "Point-in-time, charge-aware momentum backtesting for NSE India, with the full 968-configuration sweep published including the null result"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Kaustubh Rathi" }]
keywords = [
    "backtesting",
    "quantitative-finance",
    "momentum",
    "nse",
    "nifty500",
    "india",
    "equity-research",
    "reproducible-research",
    "transaction-costs",
    "survivorship-bias",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "duckdb>=1.4,<2",
    "pandas>=2.2,<4",
    "pyarrow>=18,<26",
    "numpy>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Kaustubh-Rathi/nse-alpha-lab#readme"
Repository = "https://github.com/Kaustubh-Rathi/nse-alpha-lab"
Issues = "https://github.com/Kaustubh-Rathi/nse-alpha-lab/issues"
Documentation = "https://github.com/Kaustubh-Rathi/nse-alpha-lab/blob/main/docs/HELLO_ALPHA.md"
Research = "https://github.com/Kaustubh-Rathi/nse-alpha-lab/blob/main/research/REPORT.md"

[project.optional-dependencies]
pdf = ["pypdf>=6,<7", "pymupdf>=1.26,<2"]
lab = ["streamlit>=1.40,<2"]
# Backends for `nse-alpha fetch --source kaggle|hf` (see cli.FETCH_SOURCES) and
# the `uv sync --extra fetch` command the README documents. `six` is pinned
# explicitly: kaggle 2.2.5 imports it at import time but does not declare it as
# a dependency, so without it the Kaggle backend cannot be imported at all.
fetch = ["huggingface-hub>=2,<3", "kaggle>=2,<3", "six>=1.17,<2"]

[project.scripts]
nse-alpha = "nse_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# "." (the repository root) is required, not cosmetic: several tests import
# helpers as `from tests.<module> import ...`, which resolves as a namespace
# package only when the root is importable. `python -m pytest` adds the cwd
# implicitly, but the `pytest` console script (what CI runs via `uv run pytest`)
# does not — without this the suite fails at collection on a clean checkout.
pythonpath = ["src", "."]
testpaths = ["tests"]
