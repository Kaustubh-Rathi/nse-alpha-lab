# Continuous integration: lint-free, network-free test run.
#
# Contract: this workflow NEVER downloads market data, never touches NSE/Kaggle/
# Wayback and never needs Postgres or Redis. The whole test suite runs off the
# checked-in golden JSON fixtures under tests/golden/ and a temp DuckDB.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # pyproject: requires-python = ">=3.12,<3.15"; .python-version pins 3.14.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked environment (runtime + dev group)
        # --locked  : fail instead of silently re-resolving uv.lock
        # (dev group): pytest>=9,<10 lives in [dependency-groups] dev
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Show resolved toolchain
        run: |
          uv --version
          uv run python --version

      - name: Run tests
        # pyproject sets [tool.pytest.ini_options] pythonpath = ["src"], which is
        # required because [tool.uv] package = false does not install src/.
        run: uv run pytest -q

      - name: Assert the suite did not reach the network
        # Cheap structural guard: no test may open a socket. If this ever needs to
        # change, the test is an integration test and belongs behind a marker.
        run: |
          set -euo pipefail
          if grep -rnE "\b(requests|urllib\.request|http\.client|socket\.socket)\b" tests --include="*.py" \
             | grep -vE "conftest\.py|# noqa: network-ok"; then
            echo "::warning::network-capable import found in tests/ (review required)"
          else
            echo "tests/ is network-free"
          fi
